# Lesson 13 Part B — DAGSTER_HOME/dagster.yaml template for the
# large-scale custom-launcher path.
#
# Copy this file to $DAGSTER_HOME/dagster.yaml. Switch DAGSTER_HOME
# between this (large-scale) and the Part A default (small-scale) to
# select which path is active.
#
# In prod replace the SQLite default with the Postgres block from
# learn/12-scaling/POSTGRES_MIGRATION.md — remote LSF workers MUST
# share state (SQLite is single-writer + NFS-locked → does not work).

run_launcher:
  module: pipelines.launcher
  class: LSFRunLauncher
  config:
    default_queue: normal
    default_cores: 4
    default_mem_mb: 4096
    default_walltime: "24:00"
    log_dir: /tmp/dagster-13-lsf-logs

run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # Production formula:
    #   max_concurrent_runs = min(
    #     LSF_user_slot_limit,                                   # busers / bqueues -l
    #     floor((PG_max_connections - reserved) / conns_per_worker)
    #   )
    # PgBouncer transaction pooling relaxes the PG term toward the LSF
    # term (see learn/12-scaling/POSTGRES_MIGRATION.md). Conservative
    # default below for the lesson demo:
    max_concurrent_runs: 8
    dequeue_use_threads: true
    dequeue_num_workers: 4

run_monitoring:
  enabled: true
  start_timeout_seconds: 1800   # PEND time can be long on busy grids
  poll_interval_seconds: 120    # bjobs cadence per STARTED run

telemetry:
  enabled: false

# storage — omitted = SQLite in $DAGSTER_HOME (lesson demo). For prod:
#
# storage:
#   postgres:
#     postgres_db:
#       hostname: pg.internal
#       username: dagster
#       password: { env: DAGSTER_PG_PASSWORD }
#       db_name: dagster
#       port: 5432

# workspace.yaml — pointer that lets `dagster dev` and `dagster-daemon`
# locate this flow's definitions. Leave as-is.
#
# `working_directory` MUST resolve to the spec_dagster/ root so that
# `framework` and `flows` are importable.

load_from:
  - python_module:
      module_name: flows.TEMPLATE_change_me.definitions
      working_directory: ../..

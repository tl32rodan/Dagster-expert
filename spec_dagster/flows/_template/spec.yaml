# spec.yaml — minimal flow template.
#
# After copying:
#   1. Rename the dir from _template to <your_flow_name>
#   2. Set flow_name below to match (used in UI labels / logs)
#   3. Edit dimensions: list every dim your work spans
#   4. Edit assets: at least one `compute` is needed for a useful flow
#   5. Run the verify command in ONBOARDING.md Step 2 — `load_spec`
#      will tell you exactly which field failed if the spec is malformed
#
# kind values:
#   - entry:      no script, no deps; the "start" of the graph (optional)
#   - generator:  light transformation; script_fn(*partition_vals) ->
#                 dict[abs_path, content]; framework writes files +
#                 computes content_hash data_version
#   - compute:    heavy work (typically shells out via Pipes);
#                 script_fn(*partition_vals) -> argv list; framework runs
#                 it via PipesSubprocessClient (or via LSFRunLauncher in
#                 prod) and uses the worker-reported data_version
#
# dispatch values:
#   - local:  PipesSubprocessClient + DefaultRunLauncher (local-sim,
#             dev, <=hundreds of runs). The asset body shells out to
#             the script's argv on the same node.
#   - lsf:    LSFRunLauncher (prod, >~thousands of runs). The launcher
#             bsubs `dagster api execute_run`; the asset body runs
#             in-process on the LSF node. spec.lsf or per-asset lsf
#             MUST set queue/cores/mem_mb/walltime.
#
# Whitepaper: FIVE_LAYER_WHITEPAPER.md §3 (schema) + §3.5 (the SOP).

version: 1
flow_name: TEMPLATE_change_me

dimensions:
  # Examples — replace with yours. static lists every key up-front;
  # dynamic resolves from a registry resource (advanced).
  dim_a: { type: static, values: [v1, v2, v3] }

defaults:
  dispatch: local           # change to `lsf` for grid-scale
  version: content_hash     # SHA256[:16] of generator output content

assets:
  # An entry is optional but lets you anchor "downstream of this".
  # Delete if you don't need one.
  - { name: start, kind: entry, partitioned_by: [] }

  # A generator runs cheaply on the orchestrator (or the LSF node, in
  # prod) and writes its file(s). It MUST be partitioned the same way
  # downstream consumers expect (or unpartitioned for a fan-in source).
  - name: my_generator
    kind: generator
    script: flows.TEMPLATE_change_me.script:gen_thing
    partitioned_by: [dim_a]
    depends_on:
      - { asset: start, mapping: all }

  # A compute is the heavy lifter. depends_on lists upstreams with the
  # mapping intent — the framework translates to direction-correct
  # PartitionMapping objects (whitepaper §4.1).
  - name: my_compute
    kind: compute
    script: flows.TEMPLATE_change_me.script:compute_command
    partitioned_by: [dim_a]
    op_tags: { "dagster/concurrency_key": "TEMPLATE_change_me_compute" }
    depends_on:
      - { asset: my_generator, mapping: identity }

# Only used when defaults.dispatch == lsf (or per-asset dispatch == lsf).
# Safe to delete the whole block for local-sim flows.
lsf:
  default: { queue: normal, cores: 4, mem_mb: 4096, walltime: "24:00" }
